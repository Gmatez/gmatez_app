# 16 GB machines cannot also give the Dart kernel compiler room if Gradle
# reserves 8 GB. The debug failure is "Exhausted heap space" inside
# kernel_snapshot_program, not a Java heap error.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Windows often fails to close Kotlin incremental .tab caches for Flutter plugins
# (shared_preferences_android compileDebugKotlin). Full rebuild is slower but stable.
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
